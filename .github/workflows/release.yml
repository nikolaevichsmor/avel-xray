name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version label for manual test build'
        required: false
        default: 'dev'

permissions:
  contents: write

env:
  XRAY_VERSION: v26.11.9
  XRAY_ZIP_SHA256: 1262522266337b824f07beb8e1375786b437683b3890105469088f8e17e0a69d
  WINTUN_VERSION: 0.14.1
  WINTUN_ZIP_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and verify Xray-core and Wintun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path core, tmp_dl | Out-Null

          $xrayZip = 'tmp_dl/Xray-windows-64.zip'
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION/Xray-windows-64.zip" -OutFile $xrayZip
          $xrayHash = (Get-FileHash $xrayZip -Algorithm SHA256).Hash.ToLower()
          if ($xrayHash -ne $env:XRAY_ZIP_SHA256) {
            throw "Xray SHA256 mismatch: expected $env:XRAY_ZIP_SHA256, got $xrayHash"
          }
          Expand-Archive -Path $xrayZip -DestinationPath tmp_dl/xray -Force
          Copy-Item tmp_dl/xray/xray.exe core/avel-core.exe -Force
          Copy-Item tmp_dl/xray/geoip.dat core/geoip.dat -Force
          Copy-Item tmp_dl/xray/geosite.dat core/geosite.dat -Force

          $wintunZip = 'tmp_dl/wintun.zip'
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile $wintunZip
          $wintunHash = (Get-FileHash $wintunZip -Algorithm SHA256).Hash.ToLower()
          if ($wintunHash -ne $env:WINTUN_ZIP_SHA256) {
            throw "Wintun SHA256 mismatch: expected $env:WINTUN_ZIP_SHA256, got $wintunHash"
          }
          Expand-Archive -Path $wintunZip -DestinationPath tmp_dl/wintun -Force
          Copy-Item tmp_dl/wintun/wintun/bin/amd64/wintun.dll core/wintun.dll -Force

      - name: Run unit and Xray config tests
        shell: pwsh
        run: cargo test --locked -- --skip finds_physical_interface_and_measures_real_tcp_rtt

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --locked

      - name: Package portable archive and SHA256SUMS
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $ver = $env:GITHUB_REF_NAME
          } elseif ($env:INPUT_TAG) {
            $ver = $env:INPUT_TAG
          } else {
            $ver = 'dev'
          }

          $stage = 'dist/avel-xray'
          New-Item -ItemType Directory -Force -Path "$stage/core" | Out-Null
          Copy-Item target/release/avel.exe "$stage/avel.exe" -Force
          Copy-Item core/avel-core.exe "$stage/core/avel-core.exe" -Force
          Copy-Item core/wintun.dll "$stage/core/wintun.dll" -Force
          Copy-Item core/geoip.dat "$stage/core/geoip.dat" -Force
          Copy-Item core/geosite.dat "$stage/core/geosite.dat" -Force
          Copy-Item LICENSE "$stage/LICENSE" -Force
          Copy-Item THIRD_PARTY_LICENSES.txt "$stage/THIRD_PARTY_LICENSES.txt" -Force

          $zipName = "avel-xray-$ver-windows-x64.zip"
          $zipPath = "dist/$zipName"
          Compress-Archive -Path $stage -DestinationPath $zipPath -Force

          $lines = @(
            "$((Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower())  $zipName"
            "$((Get-FileHash "$stage/avel.exe" -Algorithm SHA256).Hash.ToLower())  avel-xray/avel.exe"
            "$((Get-FileHash "$stage/core/avel-core.exe" -Algorithm SHA256).Hash.ToLower())  avel-xray/core/avel-core.exe"
            "$((Get-FileHash "$stage/core/wintun.dll" -Algorithm SHA256).Hash.ToLower())  avel-xray/core/wintun.dll"
          )
          $lines -join "`n" | Set-Content -Path dist/SHA256SUMS.txt -NoNewline -Encoding UTF8

          "ver=$ver" >> $env:GITHUB_OUTPUT
          "zip=$zipPath" >> $env:GITHUB_OUTPUT
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: avel-xray-${{ steps.pkg.outputs.ver }}-windows-x64
          path: |
            ${{ steps.pkg.outputs.zip }}
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag "${{ steps.pkg.outputs.zip }}" dist/SHA256SUMS.txt `
            --title "avel-xray $tag" `
            --notes "Portable Windows x64 build with Xray-core $env:XRAY_VERSION and Wintun $env:WINTUN_VERSION. Extract and run avel.exe."
